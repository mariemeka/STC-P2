<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<title>STC - Admin</title>
<style>
  body { font-family: monospace; margin: 20px; max-width: 1000px; }
  fieldset { margin-bottom: 15px; }
  input { font: inherit; padding: 4px; width: 80px; }
  button { font: inherit; padding: 6px 12px; margin-right: 6px; }
  table { border-collapse: collapse; width: 100%; margin-top: 8px; }
  th, td { border: 1px solid #ccc; padding: 4px 8px; text-align: left; }
  #log { background: #111; color: #0f0; padding: 10px; height: 350px; overflow-y: auto; font-size: 0.9rem; }
  .files a { display: block; }
</style>
</head>
<body>

<h2>STC - Console Admin</h2>

<fieldset>
  <legend>Paramètres</legend>
  <label>Slot (s) : <input type="number" id="slot" value="30"></label>
  <label>Overlap (s) : <input type="number" id="overlap" value="5"></label>
  <label>Pools : <input type="number" id="pools" value="1"></label>
  <div style="margin-top:10px">
    <button onclick="send('admin_start')">Démarrer</button>
    <button onclick="send('admin_pause')">Pause / Reprendre</button>
    <button onclick="send('admin_stop')">Arrêter</button>
  </div>
  <div style="margin-top:10px">État : <strong id="state-display">inactif</strong></div>
</fieldset>

<fieldset>
  <legend>Utilisateurs connectés</legend>
  <table id="user-table">
    <thead><tr><th>Nom</th><th>Pool</th><th>Ordre</th></tr></thead>
    <tbody><tr><td colspan="3">Aucun</td></tr></tbody>
  </table>
</fieldset>

<fieldset>
  <legend>Flux temps réel</legend>
  <div id="log">En attente...</div>
</fieldset>

<fieldset>
  <legend>Fichiers exportés</legend>
  <div class="files" id="files">(rien encore)</div>
</fieldset>

<script>
const ws = new WebSocket(`ws://${location.host}/ws`);
const logDiv = document.getElementById('log');
const userTbody = document.querySelector('#user-table tbody');
const stateDisplay = document.getElementById('state-display');
const filesDiv = document.getElementById('files');

ws.onopen = () => {
  addLog("Connecté.");
  ws.send(JSON.stringify({ type: "join", username: "ADMIN", user_id: "admin_master" }));
};

ws.onmessage = (event) => {
  const data = JSON.parse(event.data);

  if (data.type === "user_update") {
    const users = data.users.filter(u => u.id !== 'admin_master');
    if (!users.length) {
      userTbody.innerHTML = '<tr><td colspan="3">Aucun</td></tr>';
    } else {
      userTbody.innerHTML = users.map(u =>
        `<tr><td>${u.name}</td><td>${u.pool}</td><td>${u.order}</td></tr>`
      ).join("");
    }
  }

  if (data.type === "sync_update" || data.type === "session_started" || data.type === "session_paused") {
    const s = data.state;
    if (!s.active) stateDisplay.innerText = "inactif";
    else if (s.paused) stateDisplay.innerText = "EN PAUSE";
    else stateDisplay.innerText = `actif - slot ${s.slot_index} - ${s.time_left}s`;
  }

  if (data.type === "new_text") {
    addLog(`[P${data.pool} | slot ${data.slot_index}] ${data.user} : ${escapeHtml(data.text)}`);
  }

  if (data.type === "session_ended") {
    addLog("SESSION TERMINÉE.");
    stateDisplay.innerText = "terminée";
    if (data.files && data.files.length) {
      filesDiv.innerHTML = data.files.map(f =>
        `<a href="/download/${encodeURIComponent(f)}" target="_blank">${f}</a>`
      ).join("");
    }
  }
};

function send(type) {
  const payload = {
    type,
    slot: document.getElementById('slot').value,
    overlap: document.getElementById('overlap').value,
    pools: document.getElementById('pools').value,
  };
  ws.send(JSON.stringify(payload));
  addLog(`> ${type}`);
}

function addLog(msg) {
  const t = new Date().toLocaleTimeString();
  logDiv.innerHTML += `[${t}] ${msg}<br>`;
  logDiv.scrollTop = logDiv.scrollHeight;
}

function escapeHtml(s) {
  return s.replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}
</script>
</body>
</html>
