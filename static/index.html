<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<title>STC - Sous-titreur</title>
<style>
  body { font-family: monospace; margin: 20px; max-width: 800px; }
  #login, #app { border: 1px solid #ccc; padding: 15px; }
  #app { display: none; }
  input, button, textarea { font: inherit; padding: 6px; }
  textarea { width: 100%; height: 150px; box-sizing: border-box; }
  textarea:disabled { background: #eee; }
  .row { margin: 8px 0; }
  .badge { display: inline-block; padding: 2px 8px; border: 1px solid #888; }
  .turn-on { color: green; font-weight: bold; }
  .turn-off { color: #888; }
  .turn-soon { color: #b87000; font-weight: bold; }
  #timer { font-size: 2rem; }
  #timer.warn { color: #d93025; animation: blink 0.5s linear infinite; }
  @keyframes blink { 50% { opacity: 0.3; } }
  .flash { animation: flash 0.6s ease-out; }
  @keyframes flash { 0% { background: #b6e3b8; } 100% { background: transparent; } }

  /* Overlay countdown */
  #countdown-overlay {
    display: none;
    position: fixed; inset: 0; background: rgba(0,0,0,0.85);
    z-index: 9999; align-items: center; justify-content: center;
    flex-direction: column; color: white;
  }
  #countdown-overlay.visible { display: flex; }
  #countdown-number { font-size: 12rem; font-weight: bold; color: #ff6b6b; }
  #countdown-overlay.prealert #countdown-number { color: #ffae42; }
  #countdown-label { font-size: 1.5rem; margin-top: 20px; }
</style>
</head>
<body>

<div id="countdown-overlay">
  <div id="countdown-number">3</div>
  <div id="countdown-label">La session démarre...</div>
</div>

<div id="login">
  <h2>STC - Sous-titreur</h2>
  <div class="row">
    <label>Nom : <input type="text" id="username-input"></label>
    <button onclick="connect()">Se connecter</button>
  </div>
</div>

<div id="app">
  <div class="row">
    <span class="badge" id="user-display"></span>
    <span class="badge" id="pool-display"></span>
    <span class="badge" id="status-display">En attente</span>
  </div>
  <div class="row">Temps restant : <span id="timer">--</span> s</div>
  <div class="row" id="next-turn-row" style="display:none">⏰ À vous dans : <span id="next-turn-display">--</span> s</div>
  <div class="row">Slot courant : <span id="slot-display">-</span></div>
  <div class="row">
    <textarea id="text-input" lang="fr" spellcheck="true" autocorrect="on" autocapitalize="sentences"
              placeholder="Attendez votre tour..." disabled></textarea>
  </div>
  <div class="row">
    <button id="send-btn" onclick="sendCaption()" disabled>Envoyer (Entrée)</button>
    <span style="margin-left:15px">Caractères : <span id="char-count">0</span></span>
    <span style="margin-left:15px">Lignes : <span id="line-count">0</span></span>
  </div>
  <div class="row" style="font-size:0.85rem;color:#666">
    Tu vois ce que tu tapes en direct dans le viewer (pas besoin d'Entrée).
    Entrée = valider et passer à la ligne suivante. Auto-envoi en fin de slot.
  </div>
</div>

<script>
let ws;
let userId = sessionStorage.getItem('stc_user_id');
let username = '';
let totalChars = 0;
let totalLines = 0;
let currentSlot = 0;
let isMyTurn = false;
let prevIsMyTurn = false;
let active = false;
let paused = false;
let countdownActive = false;
let endsAt = 0;
let lastAutoFlushSlot = -1;
let countdownTimer = null;
let audioCtx = null;
let lastSentLiveText = "";
let preAlertSeconds = 5;
let nextTurnAt = null;
let inPreAlert = false;
let lastPreAlertTickSecond = null;

if (localStorage.getItem('stc_username')) {
  document.getElementById('username-input').value = localStorage.getItem('stc_username');
}

function beep(freq, duration) {
  try {
    if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    const osc = audioCtx.createOscillator();
    const gain = audioCtx.createGain();
    osc.connect(gain); gain.connect(audioCtx.destination);
    osc.frequency.value = freq;
    osc.type = 'sine';
    gain.gain.value = 0.15;
    osc.start();
    setTimeout(() => osc.stop(), duration);
  } catch (e) {}
}

function connect() {
  username = document.getElementById('username-input').value.trim();
  if (!username) { alert("Nom requis"); return; }
  localStorage.setItem('stc_username', username);

  const proto = location.protocol === 'https:' ? 'wss' : 'ws';
  ws = new WebSocket(`${proto}://${location.host}/ws`);

  ws.onopen = () => {
    ws.send(JSON.stringify({ type: "join", user_id: userId, username: username }));
  };

  ws.onmessage = (event) => {
    const msg = JSON.parse(event.data);

    if (msg.type === "welcome") {
      userId = msg.user_id;
      sessionStorage.setItem('stc_user_id', userId);
      document.getElementById('login').style.display = 'none';
      document.getElementById('app').style.display = 'block';
      document.getElementById('user-display').innerText = username;
      document.getElementById('pool-display').innerText = `Pool ${msg.pool_id} (ordre ${msg.order_in_pool})`;
      applyState(msg.state);
    }

    if (msg.type === "session_started" || msg.type === "sync_update" || msg.type === "session_paused") {
      applyState(msg.state);
    }

    if (msg.type === "session_ended") {
      active = false;
      isMyTurn = false;
      flushIfNeeded();
      stopCountdown();
      hideCountdownOverlay();
      inPreAlert = false;
      lastPreAlertTickSecond = null;
      hidePreAlertOverlay();
      document.getElementById('next-turn-row').style.display = 'none';
      updateUI();
      document.getElementById('status-display').innerText = "Session terminée";
      if (msg.files && msg.files.length) {
        alert("Session terminée. Fichiers exportés :\n" + msg.files.join("\n"));
      }
    }
  };

  ws.onclose = () => {
    document.getElementById('status-display').innerText = "Déconnecté";
    stopCountdown();
    hideCountdownOverlay();
    hidePreAlertOverlay();
  };
}

function applyState(state) {
  prevIsMyTurn = isMyTurn;
  active = state.active;
  paused = !!state.paused;
  isMyTurn = !!state.is_my_turn;
  currentSlot = (state.my_slot_index != null) ? state.my_slot_index : (state.slot_index || 0);
  document.getElementById('slot-display').innerText = currentSlot;
  endsAt = Date.now() + (state.time_left ?? 0) * 1000;

  if (state.config && state.config.pre_alert != null) preAlertSeconds = state.config.pre_alert;
  nextTurnAt = (state.next_turn_in != null) ? Date.now() + state.next_turn_in * 1000 : null;

  // Countdown phase
  const cd = state.countdown || 0;
  if (active && cd > 0) {
    countdownActive = true;
    showCountdownOverlay(cd);
    updateUI();
    return;
  } else if (countdownActive) {
    // Sortie du countdown
    countdownActive = false;
    hideCountdownOverlay();
  }

  // Transition tour fini → auto-flush
  if (prevIsMyTurn && !isMyTurn) {
    flushIfNeeded();
  }
  // Transition tour commence → alerte
  if (!prevIsMyTurn && isMyTurn && active && !paused) {
    inPreAlert = false;
    lastPreAlertTickSecond = null;
    hidePreAlertOverlay();
    document.body.classList.remove('flash'); void document.body.offsetWidth;
    document.body.classList.add('flash');
    beep(880, 150);
    setTimeout(() => beep(1100, 120), 180);
  }

  updateUI();
  startCountdown();
}

function showCountdownOverlay(seconds) {
  const overlay = document.getElementById('countdown-overlay');
  overlay.classList.remove('prealert');
  document.getElementById('countdown-label').innerText = "La session démarre...";
  document.getElementById('countdown-number').innerText = seconds;
  overlay.classList.add('visible');
}

function hideCountdownOverlay() {
  document.getElementById('countdown-overlay').classList.remove('visible');
}

function showPreAlertOverlay(seconds) {
  const overlay = document.getElementById('countdown-overlay');
  overlay.classList.add('visible', 'prealert');
  document.getElementById('countdown-number').innerText = seconds;
  document.getElementById('countdown-label').innerText = "À vous dans...";
}

function hidePreAlertOverlay() {
  const overlay = document.getElementById('countdown-overlay');
  if (overlay.classList.contains('prealert')) {
    overlay.classList.remove('visible', 'prealert');
  }
}

function startCountdown() {
  if (countdownTimer) return;
  countdownTimer = setInterval(() => {
    const remaining = Math.max(0, (endsAt - Date.now()) / 1000);
    const timerEl = document.getElementById('timer');
    timerEl.innerText = remaining.toFixed(1);

    if (isMyTurn && remaining < 3) timerEl.classList.add('warn');
    else timerEl.classList.remove('warn');

    if (isMyTurn && remaining < 0.4) flushIfNeeded();

    // ── Préavis avant le début du tour ──────────────────────────────
    const nextTurnRow = document.getElementById('next-turn-row');
    if (!isMyTurn && active && !paused && !countdownActive && nextTurnAt != null) {
      const untilTurn = (nextTurnAt - Date.now()) / 1000;
      if (untilTurn > 0) {
        nextTurnRow.style.display = 'block';
        document.getElementById('next-turn-display').innerText = untilTurn.toFixed(1);

        if (untilTurn <= preAlertSeconds) {
          if (!inPreAlert) {
            inPreAlert = true;
            beep(660, 100); // bip discret : entrée en préavis
            updateUI();
          }
          const overlayThreshold = Math.min(3, preAlertSeconds);
          if (untilTurn <= overlayThreshold) {
            const sec = Math.ceil(untilTurn);
            showPreAlertOverlay(sec);
            if (sec !== lastPreAlertTickSecond && sec > 0) {
              lastPreAlertTickSecond = sec;
              beep(440, 80); // tick chaque seconde dans les 3 dernières secondes
            }
          } else {
            hidePreAlertOverlay();
            lastPreAlertTickSecond = null;
          }
        } else if (inPreAlert) {
          inPreAlert = false;
          lastPreAlertTickSecond = null;
          hidePreAlertOverlay();
          updateUI();
        }
      } else {
        nextTurnRow.style.display = 'none';
      }
    } else {
      nextTurnRow.style.display = 'none';
      if (inPreAlert) {
        inPreAlert = false;
        lastPreAlertTickSecond = null;
        hidePreAlertOverlay();
      }
    }
    // ─────────────────────────────────────────────────────────────────
  }, 100);
}

function stopCountdown() {
  if (countdownTimer) clearInterval(countdownTimer);
  countdownTimer = null;
}

function updateUI() {
  const area = document.getElementById('text-input');
  const btn = document.getElementById('send-btn');
  const status = document.getElementById('status-display');

  if (!active) {
    area.disabled = true; btn.disabled = true;
    status.innerText = "Inactif"; status.className = "badge turn-off";
    return;
  }
  if (countdownActive) {
    area.disabled = true; btn.disabled = true;
    status.innerText = "Démarrage..."; status.className = "badge turn-off";
    return;
  }
  if (paused) {
    area.disabled = true; btn.disabled = true;
    status.innerText = "En pause"; status.className = "badge turn-off";
    return;
  }
  if (isMyTurn) {
    area.disabled = false; btn.disabled = false;
    area.placeholder = "À vous ! Entrée pour valider une phrase.";
    status.innerText = "C'EST VOTRE TOUR"; status.className = "badge turn-on";
    area.focus();
  } else {
    area.disabled = true; btn.disabled = true;
    area.placeholder = "Attendez votre tour...";
    if (inPreAlert) {
      status.innerText = "Bientôt votre tour"; status.className = "badge turn-soon";
    } else {
      status.innerText = "En attente"; status.className = "badge turn-off";
    }
  }
}

function sendCaption() {
  const area = document.getElementById('text-input');
  const val = area.value.trim();
  if (!val || !isMyTurn) return;
  ws.send(JSON.stringify({ type: "caption", text: val }));
  totalChars += val.length;
  totalLines += 1;
  document.getElementById('char-count').innerText = totalChars;
  document.getElementById('line-count').innerText = totalLines;
  area.value = "";
  lastSentLiveText = "";
}

function flushIfNeeded() {
  if (lastAutoFlushSlot === currentSlot) return;
  const area = document.getElementById('text-input');
  const val = area.value.trim();
  if (!val) return;
  if (!ws || ws.readyState !== WebSocket.OPEN) return;
  ws.send(JSON.stringify({ type: "caption", text: val }));
  totalChars += val.length;
  totalLines += 1;
  document.getElementById('char-count').innerText = totalChars;
  document.getElementById('line-count').innerText = totalLines;
  area.value = "";
  lastAutoFlushSlot = currentSlot;
  lastSentLiveText = "";
}

document.getElementById('text-input').addEventListener('keydown', (e) => {
  if (e.key === "Enter" && !e.shiftKey) {
    e.preventDefault();
    sendCaption();
  }
});

// Live typing : envoi débounce à chaque modif
let typingTimer = null;
document.getElementById('text-input').addEventListener('input', (e) => {
  if (!isMyTurn || !active || paused || countdownActive) return;
  clearTimeout(typingTimer);
  typingTimer = setTimeout(() => {
    const val = e.target.value;
    if (val === lastSentLiveText) return;
    lastSentLiveText = val;
    if (ws && ws.readyState === WebSocket.OPEN) {
      ws.send(JSON.stringify({ type: "live_typing", text: val }));
    }
  }, 150);
});

setInterval(() => {
  if (lastAutoFlushSlot !== -1 && lastAutoFlushSlot !== currentSlot) {
    lastAutoFlushSlot = -1;
  }
}, 200);
</script>
</body>
</html>
