<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<title>STC - Viewer</title>
<style>
  * { box-sizing: border-box; }
  body { font-family: 'Segoe UI', system-ui, sans-serif; margin: 0 auto; padding: 20px; max-width: 1100px;
         background: #0b0e13; color: #e6e6e6; }
  h2 { margin: 0 0 16px; font-size: 1.1rem; letter-spacing: 1px; color: #aab2c0; }

  .pool { background: #1a1a1a; border-radius: 8px; margin-bottom: 20px; overflow: hidden;
          box-shadow: 0 4px 16px rgba(0,0,0,0.4); }

  /* ── Bandeau "lower-third" live ───────────────────────────────────── */
  .live-zone {
    background: rgba(0,0,0,0.9); border-top: 3px solid #ff3b3b;
    padding: 18px 24px; min-height: 1.6rem;
  }
  .pool-tag { color: #ff3b3b; font-size: 0.75rem; font-weight: bold; letter-spacing: 1.5px; margin-bottom: 8px; }
  .live-zone-empty { color: #555; font-style: italic; font-size: 0.9rem; }
  .live-entry { font-size: 1.5rem; color: white; line-height: 1.4; font-weight: 500; }
  .live-entry .usr { color: #ff8a8a; font-size: 0.85rem; margin-right: 8px; font-weight: bold; vertical-align: middle; }
  .live-entry .text::after {
    content: '▌'; animation: blink 1s steps(1) infinite; color: #ff3b3b; margin-left: 4px;
  }
  @keyframes blink { 50% { opacity: 0; } }

  /* ── Historique (sous le bandeau live) ───────────────────────────── */
  .history {
    max-height: 220px; overflow-y: auto;
    background: #14181f; padding: 10px 24px;
    font-size: 0.95rem; line-height: 1.6;
  }
  .history-entry { padding: 6px 0; border-bottom: 1px solid #232a36; color: #c4cad6; }
  .history-entry:last-child { border-bottom: none; }
  .history-entry .ts { color: #5a6275; font-size: 0.78rem; margin-right: 8px; }
  .history-entry .usr { color: #6ea8ff; font-weight: bold; margin-right: 6px; }
  .history-empty { color: #555; font-style: italic; }

  #status { margin-bottom: 14px; padding: 10px 14px; background: #14181f; border: 1px solid #2a3140;
            border-radius: 6px; color: #aab2c0; font-size: 0.9rem; }
  #countdown-banner {
    display: none;
    background: #ff3b3b; color: white; padding: 22px;
    font-size: 2rem; font-weight: bold; text-align: center;
    margin-bottom: 14px; border-radius: 6px;
  }
  #countdown-banner.visible { display: block; }
</style>
</head>
<body>

<h2>● STC — DIRECT</h2>
<div id="countdown-banner">La session démarre dans <span id="cd-num">3</span>...</div>
<div id="status">Connexion...</div>

<div class="pool">
  <div class="live-zone">
    <div class="pool-tag">EN DIRECT</div>
    <div class="live-content" id="live-content"><span class="live-zone-empty">Aucune frappe en cours.</span></div>
  </div>
  <div class="history" id="history"><div class="history-empty">Aucun sous-titre validé pour l'instant.</div></div>
</div>

<script>
const proto = location.protocol === 'https:' ? 'wss' : 'ws';
const ws = new WebSocket(`${proto}://${location.host}/ws`);
const statusDiv = document.getElementById('status');
const cdBanner = document.getElementById('countdown-banner');
const cdNum = document.getElementById('cd-num');
const liveContent = document.getElementById('live-content');
const historyDiv = document.getElementById('history');
// liveTypers[(pool,user)] = text : permet de fusionner les frappes simultanées
// en un seul résultat affiché, sans exposer qui écrit quoi.
const liveTypers = {};
// Dernière ligne affichée — reste visible jusqu'à la suivante (comme un sous-titre vidéo),
// on ne revient jamais à "vide" entre deux phrases.
let lastDisplayedText = '';

ws.onopen = () => {
  statusDiv.innerText = "Connecté. En attente de sous-titres...";
  ws.send(JSON.stringify({ type: "viewer_join" }));
};

ws.onmessage = (event) => {
  const msg = JSON.parse(event.data);

  if (msg.type === "viewer_welcome" || msg.type === "sync_update"
      || msg.type === "session_started" || msg.type === "session_paused") {
    const s = msg.state;
    const cd = s.countdown || 0;
    if (s.active && cd > 0) {
      cdBanner.classList.add('visible');
      cdNum.innerText = cd;
      statusDiv.innerText = "Démarrage imminent...";
    } else {
      cdBanner.classList.remove('visible');
      if (!s.active) statusDiv.innerText = "Aucune session active.";
      else if (s.paused) statusDiv.innerText = "Session en pause.";
      else statusDiv.innerText = `Session active — slot ${s.slot_index} — ${s.time_left}s restantes`;
    }
  }

  // Frappe en cours (avant Entrée) — diffusion live, fusionnée, sans attribution
  if (msg.type === "live_typing") {
    const key = `${msg.pool}:${msg.user}`;
    const text = (msg.text || "").trim();
    if (text) {
      liveTypers[key] = text;
    } else {
      delete liveTypers[key];
    }
    renderLive();
  }

  // Phrase validée (Entrée ou auto-envoi en fin de slot) — flux unique, chronologique
  if (msg.type === "new_text") {
    const entry = document.createElement('div');
    entry.className = 'history-entry';
    const ts = new Date().toLocaleTimeString();
    entry.innerHTML = `<span class="ts">[${ts}]</span>${escapeHtml(msg.text)}`;
    const empty = historyDiv.querySelector('.history-empty');
    if (empty) empty.remove();
    historyDiv.appendChild(entry);
    historyDiv.scrollTop = historyDiv.scrollHeight;
    delete liveTypers[`${msg.pool}:${msg.user}`];
    lastDisplayedText = msg.text;
    renderLive();
  }

  if (msg.type === "session_ended") {
    statusDiv.innerText = "Session terminée. L'historique reste affiché.";
    cdBanner.classList.remove('visible');
    Object.keys(liveTypers).forEach(k => delete liveTypers[k]);
    renderLive();
  }
};

ws.onclose = () => {
  statusDiv.innerText = "Déconnecté du serveur.";
};

function renderLive() {
  const texts = Object.values(liveTypers);
  if (!texts.length) {
    // Personne ne tape : on garde la dernière phrase affichée, sans curseur clignotant.
    if (lastDisplayedText) {
      liveContent.innerHTML = `<div class="live-entry"><span class="text-static">${escapeHtml(lastDisplayedText)}</span></div>`;
    } else {
      liveContent.innerHTML = '<span class="live-zone-empty">Aucune frappe en cours.</span>';
    }
    return;
  }
  // Plusieurs contributions simultanées (overlap) : on affiche le résultat
  // le plus complet, sans révéler qui tape quoi.
  const best = texts.reduce((a, b) => b.length > a.length ? b : a);
  liveContent.innerHTML = `<div class="live-entry"><span class="text">${escapeHtml(best)}</span></div>`;
}

function escapeHtml(s) {
  return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}
</script>
</body>
</html>
