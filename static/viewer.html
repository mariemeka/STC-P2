<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<title>STC - Viewer</title>
<style>
  body { font-family: monospace; margin: 20px; max-width: 900px; }
  .pool { border: 1px solid #ccc; margin-bottom: 12px; padding: 10px; }
  .pool h3 { margin: 0 0 8px 0; }
  .current { font-size: 1.6rem; min-height: 2.2rem; }
  .meta { color: #666; font-size: 0.85rem; margin-top: 6px; }
  #status { margin-bottom: 10px; }
</style>
</head>
<body>

<h2>STC - Viewer</h2>
<div id="status">Connexion...</div>
<div id="pools"></div>

<script>
const ws = new WebSocket(`ws://${location.host}/ws`);
const statusDiv = document.getElementById('status');
const poolsDiv = document.getElementById('pools');
const poolEls = {}; // pool_id -> { container, current }

ws.onopen = () => {
  statusDiv.innerText = "Connecté. En attente de sous-titres...";
  ws.send(JSON.stringify({ type: "viewer_join" }));
};

ws.onmessage = (event) => {
  const msg = JSON.parse(event.data);

  if (msg.type === "viewer_welcome" || msg.type === "sync_update" || msg.type === "session_started" || msg.type === "session_paused") {
    const s = msg.state;
    if (!s.active) statusDiv.innerText = "Aucune session active.";
    else if (s.paused) statusDiv.innerText = "Session en pause.";
    else statusDiv.innerText = `Session active - slot ${s.slot_index} - ${s.time_left}s restantes`;
  }

  if (msg.type === "new_text") {
    const pool = ensurePool(msg.pool);
    pool.current.innerText = msg.text;
    pool.meta.innerText = `${msg.user} - slot ${msg.slot_index}`;
  }

  if (msg.type === "session_ended") {
    statusDiv.innerText = "Session terminée.";
  }
};

function ensurePool(poolId) {
  if (poolEls[poolId]) return poolEls[poolId];
  const div = document.createElement('div');
  div.className = 'pool';
  div.innerHTML = `<h3>Pool ${poolId}</h3><div class="current">—</div><div class="meta"></div>`;
  poolsDiv.appendChild(div);
  poolEls[poolId] = {
    container: div,
    current: div.querySelector('.current'),
    meta: div.querySelector('.meta'),
  };
  return poolEls[poolId];
}
</script>
</body>
</html>
