<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>STC — Viewer</title>
  <style>
    * { box-sizing: border-box; }
    html, body {
      margin: 0;
      padding: 0;
      height: 100%;
      background: #000;
      color: #fff;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif;
      overflow: hidden;
    }

    .stage {
      position: relative;
      width: 100vw;
      height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: flex-end;
      padding: 6vh 8vw 8vh;
    }

    /* Top-right HUD */
    .hud {
      position: absolute;
      top: 16px;
      right: 20px;
      display: flex;
      align-items: center;
      gap: 12px;
      font-size: 12px;
      color: #94a3b8;
      letter-spacing: 0.05em;
    }
    .hud-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: #facc15;
      box-shadow: 0 0 8px currentColor;
    }
    .hud-dot.ok    { background: #22c55e; }
    .hud-dot.error { background: #ef4444; }

    .hud-pill {
      background: rgba(255,255,255,0.08);
      padding: 4px 10px;
      border-radius: 999px;
      backdrop-filter: blur(6px);
    }

    /* Top-left brand */
    .brand {
      position: absolute;
      top: 18px;
      left: 22px;
      font-size: 12px;
      letter-spacing: 0.18em;
      color: #64748b;
      text-transform: uppercase;
    }

    /* Captions stack */
    .stack {
      display: flex;
      flex-direction: column;
      gap: 18px;
      width: 100%;
    }

    .caption {
      transition: opacity 600ms ease, transform 600ms ease;
    }
    .caption-text {
      font-weight: 700;
      line-height: 1.25;
      text-shadow: 0 2px 24px rgba(0,0,0,0.8), 0 0 4px rgba(0,0,0,0.9);
      word-wrap: break-word;
    }
    .caption-meta {
      font-size: 11px;
      color: #64748b;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      margin-top: 4px;
    }

    /* Past captions: smaller and dimmer */
    .caption.past .caption-text {
      font-size: clamp(20px, 2.6vw, 32px);
      color: #64748b;
    }
    /* Current (latest) caption: huge, white */
    .caption.current .caption-text {
      font-size: clamp(36px, 5.8vw, 80px);
      color: #fff;
    }
    .caption.current .caption-meta { color: #94a3b8; }

    /* Empty state */
    .empty-state {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      position: absolute;
      inset: 0;
      pointer-events: none;
      color: #475569;
      gap: 14px;
    }
    .empty-state.hidden { display: none; }
    .pulse {
      width: 12px;
      height: 12px;
      border-radius: 50%;
      background: #475569;
      animation: pulse 1.6s ease-in-out infinite;
    }
    @keyframes pulse {
      0%, 100% { opacity: 0.3; transform: scale(1); }
      50%      { opacity: 1; transform: scale(1.3); }
    }
    .empty-text { font-size: 18px; letter-spacing: 0.04em; }

    .audio-overlay {
      display: none;
      position: absolute;
      inset: 0;
      background: rgba(0,0,0,0.85);
      align-items: center;
      justify-content: center;
      z-index: 10;
      cursor: pointer;
      flex-direction: column;
      gap: 14px;
      backdrop-filter: blur(6px);
    }
    .audio-overlay.visible { display: flex; }
    .audio-overlay-icon { font-size: 64px; }
    .audio-overlay-text { font-size: 20px; color: #facc15; }
  </style>
</head>
<body>
  <div class="stage">
    <div class="brand">STC · Viewer</div>

    <div class="hud">
      <div class="hud-pill"><span id="connected-count">0</span> sous-titreur(s)</div>
      <span id="status-dot" class="hud-dot"></span>
    </div>

    <div class="empty-state" id="empty-state">
      <span class="pulse"></span>
      <span class="empty-text" id="empty-text">En attente de sous-titres…</span>
    </div>

    <div class="stack" id="stack"></div>

    <div class="audio-overlay" id="audio-overlay">
      <div class="audio-overlay-icon">🎵</div>
      <div class="audio-overlay-text">Cliquer pour activer l'audio</div>
    </div>
    <audio id="audio" preload="auto"></audio>
  </div>

  <script>
    const $ = (id) => document.getElementById(id);
    const wsProto = location.protocol === "https:" ? "wss:" : "ws:";
    const ws = new WebSocket(`${wsProto}//${location.host}/ws/viewer`);

    // Latest text per slot_index, displayed in slot_index order
    const slots = new Map();      // slot_index -> { text, contributors }
    const MAX_VISIBLE = 4;        // current + 3 past

    function setStatus(cls, label) {
      const dot = $("status-dot");
      dot.className = "hud-dot" + (cls ? " " + cls : "");
      dot.title = label;
    }

    function render() {
      const stack = $("stack");
      const empty = $("empty-state");

      const ordered = [...slots.entries()].sort((a, b) => a[0] - b[0]);
      const visible = ordered.slice(-MAX_VISIBLE);

      if (visible.length === 0) {
        stack.innerHTML = "";
        empty.classList.remove("hidden");
        return;
      }
      empty.classList.add("hidden");

      stack.innerHTML = visible.map(([slotIdx, data], i) => {
        const isCurrent = i === visible.length - 1;
        const cls = isCurrent ? "caption current" : "caption past";
        const meta = isCurrent
          ? `Slot ${slotIdx} · ${data.contributors} contribution(s)`
          : `Slot ${slotIdx}`;
        return `
          <div class="${cls}">
            <div class="caption-text">${escapeHtml(data.text)}</div>
            <div class="caption-meta">${meta}</div>
          </div>
        `;
      }).join("");
    }

    function escapeHtml(s) {
      return String(s).replace(/[&<>"']/g, (c) => ({
        "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;"
      })[c]);
    }

    ws.addEventListener("open",  () => setStatus("ok", "Connecté"));
    ws.addEventListener("error", () => setStatus("error", "Erreur"));
    ws.addEventListener("close", () => {
      setStatus("error", "Déconnecté");
      $("empty-text").textContent = "Connexion perdue — recharge la page";
    });

    ws.addEventListener("message", (e) => {
      const msg = JSON.parse(e.data);
      switch (msg.type) {
        case "fused_caption":
          if (msg.text && msg.text.trim()) {
            slots.set(msg.slot_index, {
              text: msg.text,
              contributors: msg.contributors,
            });
            render();
          }
          break;

        case "user_joined":
        case "user_left":
          $("connected-count").textContent = msg.connected_users.length;
          break;

        case "audio_start":
          syncAudio(msg.url, msg.started_at);
          break;

        case "audio_stop":
          $("audio").pause();
          $("audio-overlay").classList.remove("visible");
          break;
      }
    });

    // Audio sync
    const audioEl = $("audio");
    const audioOverlay = $("audio-overlay");
    let pendingAudio = null;

    function syncAudio(url, started_at) {
      const elapsed = Math.max(0, Date.now() / 1000 - started_at);
      if (audioEl.src !== location.origin + url) {
        audioEl.src = url;
      }
      audioEl.currentTime = elapsed;
      audioEl.play()
        .then(() => {
          pendingAudio = null;
          audioOverlay.classList.remove("visible");
        })
        .catch(() => {
          pendingAudio = { url, started_at };
          audioOverlay.classList.add("visible");
        });
    }

    audioOverlay.addEventListener("click", () => {
      if (!pendingAudio) return;
      audioEl.currentTime = Math.max(0, Date.now() / 1000 - pendingAudio.started_at);
      audioEl.play().then(() => {
        pendingAudio = null;
        audioOverlay.classList.remove("visible");
      });
    });
  </script>
</body>
</html>
