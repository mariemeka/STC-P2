<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<title>STC - Viewer</title>
<style>
  body { font-family: monospace; margin: 20px; max-width: 1000px; background: #fafafa; }
  .pool { border: 1px solid #ccc; margin-bottom: 12px; padding: 12px; background: white; }
  .pool h3 { margin: 0 0 8px 0; color: #555; }
  .live { font-size: 1.8rem; min-height: 2.4rem; line-height: 1.3; color: #1a73e8; }
  .live.typing::after { content: '▌'; animation: cursorBlink 1s steps(1) infinite; color: #888; }
  @keyframes cursorBlink { 50% { opacity: 0; } }
  .confirmed { font-size: 1.4rem; min-height: 1.8rem; color: #222; margin-top: 6px; }
  .meta { color: #888; font-size: 0.85rem; margin-top: 6px; }
  #status { margin-bottom: 10px; padding: 8px; background: white; border: 1px solid #ccc; }
  #countdown-banner {
    display: none;
    background: #ff6b6b; color: white; padding: 20px;
    font-size: 2rem; font-weight: bold; text-align: center;
    margin-bottom: 12px;
  }
  #countdown-banner.visible { display: block; }
</style>
</head>
<body>

<h2>STC - Viewer</h2>
<div id="countdown-banner">La session démarre dans <span id="cd-num">3</span>...</div>
<div id="status">Connexion...</div>
<div id="pools"></div>

<script>
const ws = new WebSocket(`ws://${location.host}/ws`);
const statusDiv = document.getElementById('status');
const poolsDiv = document.getElementById('pools');
const cdBanner = document.getElementById('countdown-banner');
const cdNum = document.getElementById('cd-num');
const poolEls = {};

ws.onopen = () => {
  statusDiv.innerText = "Connecté. En attente de sous-titres...";
  ws.send(JSON.stringify({ type: "viewer_join" }));
};

ws.onmessage = (event) => {
  const msg = JSON.parse(event.data);

  if (msg.type === "viewer_welcome" || msg.type === "sync_update" || msg.type === "session_started" || msg.type === "session_paused") {
    const s = msg.state;
    const cd = s.countdown || 0;
    if (s.active && cd > 0) {
      cdBanner.classList.add('visible');
      cdNum.innerText = cd;
      statusDiv.innerText = "Démarrage imminent...";
    } else {
      cdBanner.classList.remove('visible');
      if (!s.active) statusDiv.innerText = "Aucune session active.";
      else if (s.paused) statusDiv.innerText = "Session en pause.";
      else statusDiv.innerText = `Session active — slot ${s.slot_index} — ${s.time_left}s restantes`;
    }
  }

  // Frappe en cours (avant Entrée)
  if (msg.type === "live_typing") {
    const pool = ensurePool(msg.pool);
    pool.live.innerText = msg.text || "—";
    if (msg.text) pool.live.classList.add('typing');
    else pool.live.classList.remove('typing');
    pool.meta.innerText = `${msg.user} — slot ${msg.slot_index} (en cours)`;
  }

  // Texte confirmé (après Entrée ou auto-envoi)
  if (msg.type === "new_text") {
    const pool = ensurePool(msg.pool);
    pool.confirmed.innerText = msg.text;
    pool.live.innerText = "—";
    pool.live.classList.remove('typing');
    pool.meta.innerText = `${msg.user} — slot ${msg.slot_index} ✓`;
  }

  if (msg.type === "session_ended") {
    statusDiv.innerText = "Session terminée.";
    cdBanner.classList.remove('visible');
    // Clear live indicators
    Object.values(poolEls).forEach(p => {
      p.live.innerText = "—";
      p.live.classList.remove('typing');
    });
  }
};

function ensurePool(poolId) {
  if (poolEls[poolId]) return poolEls[poolId];
  const div = document.createElement('div');
  div.className = 'pool';
  div.innerHTML = `
    <h3>Pool ${poolId}</h3>
    <div class="live">—</div>
    <div class="confirmed">—</div>
    <div class="meta"></div>
  `;
  poolsDiv.appendChild(div);
  poolEls[poolId] = {
    container: div,
    live: div.querySelector('.live'),
    confirmed: div.querySelector('.confirmed'),
    meta: div.querySelector('.meta'),
  };
  return poolEls[poolId];
}
</script>
</body>
</html>
