<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>STC - Viewer</title>
    <style>
        body { 
            margin: 0; background: #000; 
            display: flex; flex-direction: column;
            align-items: center; justify-content: center;
            min-height: 100vh; font-family: Arial, sans-serif;
        }
        .video-container { position: relative; width: 90vw; max-width: 1000px; }
        video { width: 100%; border-radius: 8px; display: block; }

        .subtitles-overlay {
            position: absolute;
            bottom: 40px; left: 50%;
            transform: translateX(-50%);
            width: 90%;
            text-align: center;
            background: rgba(0,0,0,0.75);
            color: white;
            font-size: 24px;
            padding: 10px 16px;
            border-radius: 8px;
            min-height: 40px;
            transition: opacity 0.3s;
        }

        /* Texte en cours de frappe (live) — légèrement transparent */
        .subtitles-overlay.live { opacity: 0.75; font-style: italic; }

        .top-bar {
            width: 90vw; max-width: 1000px;
            display: flex; justify-content: space-between;
            color: white; font-size: 14px;
            padding: 10px 0; opacity: 0.8;
        }

        .slot-badge {
            background: #2E75B6; color: white;
            padding: 2px 10px; border-radius: 12px;
            font-size: 13px; margin-left: 8px;
        }
    </style>
</head>
<body>

    <div class="top-bar">
        <span>📺 STC — Écran d'affichage</span>
        <span>👥 Connectés : <strong id="nb-connectes">0</strong></span>
        <span id="statut">🔄 Connexion...</span>
    </div>

    <div class="video-container">
            <video id="player" controls>
    <source src="/static/media/video.mp4" type="video/mp4">
</video>

        <div class="subtitles-overlay" id="subtitles">
            En attente de sous-titres...
        </div>
    </div>



    <script>
        const ws = new WebSocket("ws://" + location.host + "/ws");

        // ── Connexion ──────────────────────────────────────────────────
        ws.onopen = () => {
            // S'identifier comme viewer
            ws.send(JSON.stringify({ type: "viewer_join" }));
            document.getElementById("statut").textContent = "✅ Connecté";
        };

        // ── Messages reçus ─────────────────────────────────────────────
        ws.onmessage = (event) => {
            const msg = JSON.parse(event.data);

            // Mise à jour nombre de connectés
            if (msg.type === "user_update") {
                document.getElementById("nb-connectes").textContent = 
                    msg.users ? msg.users.length : 0;
            }

            // Sous-titre confirmé (envoi final)
            if (msg.type === "new_text") {
                const sub = document.getElementById("subtitles");
                sub.textContent = msg.text;
                sub.classList.remove("live");
            }

            // Frappe en cours (live typing) — affiché en italique
            if (msg.type === "live_typing") {
                const sub = document.getElementById("subtitles");
                sub.textContent = msg.text;
                sub.classList.add("live");
            }

            // Sync état session
            if (msg.type === "sync_update" || msg.type === "session_started") {
                const s = msg.state;
                if (s && s.active) {
                    document.getElementById("statut").textContent = 
                        `✅ Session active — slot ${s.slot_index}`;
                }
            }

            // Session terminée
            if (msg.type === "session_ended") {
                document.getElementById("subtitles").textContent = 
                    "✅ Session terminée";
                document.getElementById("statut").textContent = "Session terminée";
            }
        };

        ws.onclose = () => {
            document.getElementById("statut").textContent = "❌ Déconnecté";
        };

        ws.onerror = (e) => {
            document.getElementById("statut").textContent = "⚠️ Erreur connexion";
            console.error("WebSocket error:", e);
        };
    </script>
</body>
</html>
